[project]
name = "securehpc"
version = "0.1.0"
description = "Client for running secure workflows on shared HPC systems"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
securehpc = "securehpc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["securehpc"]
