[cluster]
user = "uXXXXX"
login_node = "glogin7.hpc.gwdg.de"
exec_dir = "/mnt/ceph-hdd/cold/your_path"  # folder on the cluster for job files
reservation = "secure-hpc"
sbatch = "/usr/local/slurm/slurm/current/install/bin/sbatch"
sacct = "/usr/local/slurm/slurm/current/install/bin/sacct"

[vault]
address = "https://kms.hpc.gwdg.de"
user = "user_2"
token_file = "~/.config/securehpc/vault.token"  # path only, never the token itself
proxy = false  # SOCKS proxy through the login node

[gpg]
node_key = "agq001"  # public key of the secure node
signing_key = "user_key"  # your own key

[container]
private_key = "~/.config/securehpc/rsa_pri.pem"
